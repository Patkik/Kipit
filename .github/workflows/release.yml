name: Release Kipit APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "KEYSTORE_PATH=release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_AL" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "Release keystore configured."
          else
            echo "Notice: RELEASE_KEYSTORE_BASE64 not configured. Falling back to debug signing for this release."
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Locate & Rename Release APK
        id: locate_apk
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in release directory, searching all outputs..."
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi

          TARGET_APK="app/build/outputs/apk/release/kipit-$TAG.apk"
          mkdir -p "$(dirname "$TARGET_APK")"
          cp "$APK_FILE" "$TARGET_APK"
          echo "Packaged APK: $TARGET_APK"
          echo "TARGET_APK=$TARGET_APK" >> $GITHUB_ENV

      - name: Publish GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kipit ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.TARGET_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
